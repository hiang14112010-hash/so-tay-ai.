<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bảng xếp hạng mẫu và tiến độ học mô phỏng trong 7 ngày của Sổ tay AI.">
  <title>Bảng xếp hạng mẫu · Sổ tay AI</title>
  <link rel="icon" href="book.png" type="image/png">
  <link rel="stylesheet" href="app.css?v=15">
  <style>
    .sample-page { width: min(1080px, 100%); margin: 0 auto; padding: 24px clamp(14px, 4vw, 36px) 40px; }
    .sample-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; }
    .sample-header .brand { margin: 0; }
    .sample-header .button { flex: none; }
    .sample-intro { margin-bottom: 22px; }
    .sample-intro h1 { font: 700 clamp(32px, 5vw, 52px)/1.15 var(--serif); margin: 10px 0 6px; }
    .sample-intro p { margin: 0; color: var(--muted); }
    .sample-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
    .sample-grid .card { min-width: 0; padding: clamp(12px, 3vw, 25px); }
    .sample-grid h2 { margin-top: 0; }
    .sample-grid .leaderboard-table th, .sample-grid .leaderboard-table td { padding: 9px 7px; }
    .sample-grid .leaderboard-table :is(th,td):first-child { text-align: center; }
    .sample-grid .leaderboard-table :is(th,td):nth-child(n+3) { text-align: right; }
    #sample-profile { width: 100%; }
    #sample-summary { color: var(--muted); }
    .sample-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin: 15px 0; padding: 0; list-style: none; }
    .sample-days li { display: grid; grid-template-rows: auto 100px auto; gap: 4px; text-align: center; font-size: 11px; }
    .sample-days li strong { font-size: 14px; }
    .sample-day-track { display: flex; align-items: end; justify-content: center; background: var(--sage); border-radius: 7px; overflow: hidden; }
    .sample-day-track span { width: 100%; border-radius: 7px; background: var(--forest); }
    @media (max-width: 720px) {
      .sample-grid { grid-template-columns: 1fr; }
      .sample-header .button { padding-inline: 10px; }
    }
  </style>
</head>
<body>
  <main class="sample-page">
    <header class="sample-header">
      <a class="brand" href="./"><img class="brand-mark" src="book.png" alt=""><span>Sổ tay <b>AI</b></span></a>
      <a class="button small" href="./">Vào Sổ tay AI</a>
    </header>
    <div class="sample-intro">
      <span class="pill green">Dữ liệu mô phỏng</span>
      <h1>Bảng xếp hạng mẫu</h1>
      <p>10 hồ sơ minh họa tiến độ học và làm bài trong 7 ngày.</p>
    </div>
    <div class="sample-grid">
      <section class="card" aria-labelledby="sample-rank-title">
        <h2 id="sample-rank-title">Xếp hạng 7 ngày</h2>
        <table class="leaderboard-table">
          <thead><tr><th scope="col">Hạng</th><th scope="col">Người học</th><th scope="col">Từ đã học</th><th scope="col">XP</th></tr></thead>
          <tbody id="sample-rows"></tbody>
        </table>
      </section>
      <section class="card" aria-labelledby="sample-progress-title">
        <h2 id="sample-progress-title">Tiến độ làm bài</h2>
        <label for="sample-profile">Chọn hồ sơ</label>
        <select id="sample-profile"></select>
        <p id="sample-summary" role="status"></p>
        <ol class="sample-days" id="sample-days" aria-label="Số câu đúng mỗi ngày"></ol>
        <p class="subtext">Mỗi câu đúng mới trong ngày được tính 10 XP.</p>
      </section>
    </div>
    <noscript><p>Vui lòng bật JavaScript để xem bảng xếp hạng và biểu đồ tiến độ.</p></noscript>
  </main>
  <script type="module">
    import {sampleRanking as profiles} from './test-accounts.mjs?v=2';
    const maxCorrect=Math.max(...profiles.flatMap(profile=>profile.week));
    const rows=document.getElementById('sample-rows');
    const select=document.getElementById('sample-profile');
    const summary=document.getElementById('sample-summary');
    const days=document.getElementById('sample-days');

    profiles.forEach(({name,words,xp},index)=>{
      const row=rows.insertRow();
      for(const value of [index+1,name,words,xp]){
        row.insertCell().textContent=value;
      }
      select.add(new Option(name,index));
    });

    function showWeek(){
      const {week,total}=profiles[Number(select.value)];
      summary.textContent=total+' câu đúng trong 7 ngày';
      days.replaceChildren(...week.map((correct,index)=>{
        const item=document.createElement('li');
        const value=document.createElement('strong');
        const track=document.createElement('span');
        const bar=document.createElement('span');
        const label=document.createElement('span');
        value.textContent=correct;
        track.className='sample-day-track';
        track.setAttribute('aria-hidden','true');
        bar.style.height=(correct/maxCorrect*100)+'%';
        track.append(bar);
        label.textContent='Ngày '+(index+1);
        item.append(value,track,label);
        return item;
      }));
    }
    select.addEventListener('change',showWeek);
    showWeek();
  </script>
</body>
</html>
